syntax = "proto3";
package proto_bufs;






message KeyBody{
    string grid = 1;
    string public_key = 2;
}

message Record{
    string grid = 1;
}


message KeyReference{
    string grid = 1;
    bytes public_key = 2;
}

message Field{
    string key = 1;
    string type = 2;
    bytes value = 3;
    bytes nonce = 4;
}

message Payload{
    string grid = 1;
    string type = 2;
    string action = 3;
    repeated Field fields = 4;
    bytes nonce = 5;
}

message HashPayload{
    string grid = 1;
    string type = 2;
    string action = 3;
    bytes fields = 4;
    bytes nonce = 5;
}

message Signature{
    string grid = 1;
    string resource = 2;
    bytes signature = 3;
}


message MerkleProof{
    repeated bytes hashes = 1;
    string type = 2;
    uint32 block = 3;
    string grid = 4;
}


message Resource{
    Payload payload = 1;
    repeated Resource signatures = 2;
    repeated MerkleProof proof = 3;
    int32 status = 4;
}


message CommitMessage{
    bytes hash = 1;
    repeated string stakes = 2;
}

message ChainMessage{
    string type = 1;
    bytes message = 2;
}

message MultiResource{
    repeated Payload payloads = 1; 
}


message BloomFilter{
    bytes filter = 1;
    int32 num_hashes = 2;
}

message Header{
    int32 num = 1;
    bytes previous = 2;
    bytes merkle_root = 3;
    BloomFilter bloom = 4;
    string key = 5;
    string stake = 6;
    bytes state_root = 7;
}

message NewBlock{
    Header header = 1;
    bytes resources = 2;
}

message BulkResources{
    repeated Resource resources = 1;
}

message HostMessage{
    string type = 1;
    bool success = 2;
    bytes message = 3;
}

message Time{
    string type = 1;
    bytes time = 2;
}

message ResourceRequest{
    repeated string grid = 1;
}

message ResourceResponse{
    repeated Resource resources = 1;
}

message GridStatus{
    string status = 1;
    uint64 block = 2;
}

message GridExists{
    string grid = 1;
    bool exists = 2;
    repeated GridStatus status = 3;
}

message GridResponse{
    repeated GridExists exists = 1;
}

message ResourceStatus{
    string grid = 1;
    string status = 2;
    Time time = 3;
}

message RevealMessage{
    bytes value = 1;
    bytes nonce = 2;
}



message BlockHead{
    int32 num = 1;
    bytes merkle_root = 2;
    BloomFilter bloom = 3;
}

message MerkleLevel{
    repeated bytes nodes = 1;
}

message MerkleTree{
    bytes hashes = 1;
    int32 leaf_count = 2;
}

message Block{
    Header body = 1;
    bytes body_signature = 2;
    repeated Resource resources = 3;
}

message ConsensusMessage{
    string type = 1;
    bytes identifier = 2;
    bytes message = 3;
    bytes signature = 4;
    string geid = 5;
    Resource key = 6;
}

message StateEntity{
    uint64 balance = 1;
}

message StateNode{
    repeated bytes children = 1;
    StateEntity entity = 2;
}


message ExecutionIo{
    string key = 1;
    string type = 2;
    bytes value = 3;
}

message ExecutionResult{
    repeated ExecutionIo returns = 1;
    uint32 cost = 2;
}


message Execution{
    string executable = 1;
    ExecutionIo inputs = 2;
    ExecutionResult result = 3;
}


message Code{
    string operation = 1;
    repeated bytes operands = 2;
}


message Routine{
    string name = 1;
    repeated Code instructions = 2;
}

message Operand{
    string type = 1;
    bytes key = 2;
}

message Instruction{
    string operation = 1;
    repeated Operand operands = 2;
}
message ExecutableFrame{
    repeated Instruction instructions = 1;
}